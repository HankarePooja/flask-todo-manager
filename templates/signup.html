{% extends 'base.html' %}
{% block body %}
<div class="login-section d-flex justify-content-center align-items-center">
    <div class="container"
        style="background-color: black;margin-top: 10px;border-radius: 25px; height: 455px; color: white;max-width: 700px;">
        <form action="/signup" method="POST">
            <div class="form-group" style="margin-bottom: .2rem;">
                <label for="exampleInputEmail1" style="margin-top: 1rem;font-size: 20px;">Email address</label>
                <input type="email" name="email" class="form-control" id="exampleInputEmail1"
                    aria-describedby="emailHelp">
                <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone
                    else.</small>
            </div>
            <div class="form-group" style="margin-top: 1rem;">
                <label for="exampleInputPassword1" style="font-size: 20px;">Password</label>
                <input type="password" name="password" class="form-control" id="exampleInputPassword1">
                <small id="emailHelp" class="form-text text-muted">Forgot Password?</small>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="margin-left: 290px;">Sign up ➜</button>
            <small id="emailHelp" class="form-text text-muted" style="margin-left: 21rem;margin-top: 1rem;">OR</small>
            <div class="text-center mt-3">
                <a href="{{ url_for('google_login') }}" class="btn btn-light btn-lg w-50">
                    <img src="https://developers.google.com/identity/images/g-logo.png"
                        style="width:20px; margin-right:10px;">
                    Continue with Google
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
