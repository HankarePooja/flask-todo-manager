{% extends 'base.html' %}
{% block body %}
<div class="login-section d-flex justify-content-center align-items-center">
    <div class="container"
        style="background-color: black;margin-top: 10px;border-radius: 25px; height: 455px; color: white;max-width: 700px;">
        <form action="/login" method="POST">
            <div class="form-group" style="margin-bottom: .2rem;">
                <label name="email" style="margin-top: 1rem;font-size: 20px;">Email address</label>
                <input type="email" class="form-control" name="email" id="title" aria-describedby="emailHelp">
                <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone
                    else.</small>
            </div>
            <div class="form-group" style="margin-top: 1rem;">
                <label for="password" name="password" style="font-size: 20px;">Password</label>
                <input type="password" class="form-control" name="password" id="pass">
                <a href="/forgot-password" class="signup-link">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="margin-left: 290px;">Log in ➜</button>
            <small id="emailHelp" class="form-text text-muted" style="margin-left: 21rem;margin-top: 1rem;">OR</small>
            <div class="text-center mt-3">
                <a href="{{ url_for('google_login') }}" class="btn btn-light btn-lg w-50">
                    <img src="https://developers.google.com/identity/images/g-logo.png"
                        style="width:20px; margin-right:10px;">
                    Continue with Google
                </a>
            </div>
            <small class="form-text text-muted" style="margin-left: 16rem; margin-top: 1rem;">
                Don't have an account?
                <a href="/signup" class="signup-link">Sign up</a>
            </small>
        </form>
    </div>
</div>
{% endblock %}
